name: Pipeline CI/CD

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Tests, image Docker et notification
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        id: checkout
        uses: actions/checkout@v4

      - name: Configurer PHP
        id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Vérifier la syntaxe PHP
        id: php-lint
        shell: bash
        run: |
          mapfile -t php_files < <(git ls-files '*.php')
          if (( ${#php_files[@]} == 0 )); then
            echo "Aucun fichier PHP à vérifier pour le moment."
            exit 0
          fi

          for file in "${php_files[@]}"; do
            php -l "$file"
          done

      - name: Installer les dépendances Composer
        id: composer
        if: ${{ hashFiles('composer.json') != '' }}
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Exécuter les tests PHPUnit
        id: phpunit
        if: ${{ hashFiles('composer.json') != '' }}
        shell: bash
        run: |
          if [[ ! -x vendor/bin/phpunit ]]; then
            echo "::error::PHPUnit est introuvable. Ajoutez phpunit/phpunit aux dépendances de développement Composer."
            exit 1
          fi
          vendor/bin/phpunit

      - name: Signaler les tests en attente
        if: ${{ hashFiles('composer.json') == '' }}
        run: echo "Tests PHPUnit en attente de la création du projet PHP et de son composer.json."

      - name: Définir l’environnement de l’image
        id: image-env
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "app_env=production" >> "$GITHUB_OUTPUT"
          else
            echo "app_env=development" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer les tags de l’image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Se connecter à GHCR
        id: login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l’image Docker
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_ENV=${{ steps.image-env.outputs.app_env }}

      - name: Notifier Google Chat
        if: always()
        shell: bash
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.ref_name }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PHP_LINT_OUTCOME: ${{ steps.php-lint.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_PHP_OUTCOME: ${{ steps.setup-php.outcome }}
          COMPOSER_OUTCOME: ${{ steps.composer.outcome }}
          PHPUNIT_OUTCOME: ${{ steps.phpunit.outcome }}
          IMAGE_ENV_OUTCOME: ${{ steps.image-env.outcome }}
          META_OUTCOME: ${{ steps.meta.outcome }}
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          DOCKER_OUTCOME: ${{ steps.docker.outcome }}
        run: |
          if [[ -z "$GOOGLE_CHAT_WEBHOOK_URL" ]]; then
            echo "::error::Le secret GOOGLE_CHAT_WEBHOOK_URL doit être configuré dans les paramètres du dépôt."
            exit 1
          fi

          status="SUCCÈS"
          if [[ "$JOB_STATUS" != "success" ]]; then
            status="ÉCHEC"
          fi

          message="Pipeline CI/CD : ${status}
          Référence : ${REF_NAME}
          Commit : ${COMMIT_SHA:0:7} — ${COMMIT_MESSAGE}
          Déclenchée par : ${ACTOR}"

          if [[ "$JOB_STATUS" != "success" ]]; then
            failures=()
            [[ "$CHECKOUT_OUTCOME" == "failure" ]] && failures+=("récupération du code")
            [[ "$SETUP_PHP_OUTCOME" == "failure" ]] && failures+=("configuration de PHP")
            [[ "$PHP_LINT_OUTCOME" == "failure" ]] && failures+=("vérification de la syntaxe PHP")
            [[ "$COMPOSER_OUTCOME" == "failure" ]] && failures+=("installation des dépendances Composer")
            [[ "$PHPUNIT_OUTCOME" == "failure" ]] && failures+=("tests PHPUnit")
            [[ "$IMAGE_ENV_OUTCOME" == "failure" ]] && failures+=("configuration de l’environnement de l’image")
            [[ "$META_OUTCOME" == "failure" ]] && failures+=("préparation des tags Docker")
            [[ "$LOGIN_OUTCOME" == "failure" ]] && failures+=("connexion à GHCR")
            [[ "$DOCKER_OUTCOME" == "failure" ]] && failures+=("construction/publication de l’image Docker")

            if (( ${#failures[@]} > 0 )); then
              failure_reason=$(IFS=', '; echo "${failures[*]}")
            else
              failure_reason="une étape de la pipeline a échoué (consultez les logs)"
            fi
            message+=$'\n'
            message+="Raison : ${failure_reason}
          Logs : ${RUN_URL}"
          fi

          payload=$(jq -n --arg text "$message" '{text: $text}')
          curl --fail --silent --show-error --retry 3 \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "$payload" \
            "$GOOGLE_CHAT_WEBHOOK_URL"